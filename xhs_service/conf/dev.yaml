app:
  name: xhs-service
  version: v1
  env: ${APP_ENV:-dev}

server:
  enabled: true
  address: ${SERVER_ADDR:-:8082}

database:
  # The auth/authz example uses an in-process mock repository; no database is required.
  enabled: false
  driver: postgres
  dsn: ${POSTGRES_DSN:-postgres://media_auth:media_auth@127.0.0.1:5432/xhs-service?sslmode=disable}
  max_open_conns: 50
  max_idle_conns: 10
  migrate_on_start: true

consul:
  enabled: ${CONSUL_ENABLED:-false}

consul_kv:
  enabled: ${CONSUL_KV_ENABLED:-false}

internal_jwt:
  enabled: ${INTERNAL_JWT_ENABLED:-true}
  issuer: ${INTERNAL_JWT_ISSUER:-oathkeeper}
  audiences: ["internal-api"]
  jwks_url: ${INTERNAL_JWKS_URL:-http://127.0.0.1:4456/.well-known/jwks.json}
  allowed_algorithms: ["RS256"]
  refresh_interval_seconds: 300
  http_timeout_ms: 2000
  clock_skew_seconds: 30
  protected_prefixes: ["/v1/xhs/"]

keto:
  # Keto is introduced in the next module; this module uses mock authorization.
  enabled: ${KETO_ENABLED:-false}
  read_url: ${KETO_READ_URL:-http://127.0.0.1:4466}
  request_timeout_ms: 2000

otel:
  enabled: ${OTEL_ENABLED:-false}

prometheus:
  enabled: ${PROMETHEUS_ENABLED:-false}

access_log:
  enabled: true
  format: "[${time}] ${status} - ${latency} ${method} ${path}"
  time_format: "2006-01-02T15:04:05Z"

log:
  enabled: true
  level: ${LOG_LEVEL:-debug}
  dir: ${LOG_DIR:-}
  filename: app.log
  max_size_mb: 100
  max_backups: 10
  max_age_days: 7
  compress: true
  console: true

recovery:
  enabled: true
  print_stack: true

request_id:
  enabled: true
  header: "X-Request-ID"

cors:
  enabled: true
  allow_origins: ["*"]
  allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allow_headers: ["*"]
  allow_credentials: false
  max_age_seconds: 600

pprof:
  enabled: true
  prefix: "/debug/pprof"

health:
  enabled: true
  path: "/health"
