services:
  xhs_service:
    build:
      context: ..
      dockerfile: xhs_service/Dockerfile
    ports:
      - "8082:8082"
    env_file:
      - ../docker-compose/.env.${INFRA:-e2e}
    environment:
      SERVER_ADDR: ":8082"
      POSTGRES_DSN: postgres://media_auth:media_auth@host.docker.internal:5432/xhs-service?sslmode=disable
      LOG_DIR: /media_logs/xhs-service
    volumes:
      - ../media_logs/xhs-service:/media_logs/xhs-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
