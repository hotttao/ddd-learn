serve:
  http:
    host: 0.0.0.0
    port: 4420
credentials:
  issuer: talos
  derived_tokens:
    jwt:
      signing_keys:
        urls: ["file:///etc/talos/jwks.json"]
db:
  dsn: sqlite3:///var/lib/talos/talos.db?_journal_mode=WAL
secrets:
  hmac:
    current: docker-compose-hmac-secret-minimum-32-chars-long

