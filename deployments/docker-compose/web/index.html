<!doctype html>
<meta charset="utf-8">
<title>XHS auth/authz demo</title>
<style>body{font:16px sans-serif;max-width:760px;margin:40px auto}button{margin:4px;padding:8px}#log{white-space:pre-wrap;background:#f4f4f4;padding:12px}</style>
<h1>组织 G · 抓取演示</h1>
<p>选择用户后可模拟权限：Alice 是管理员，Bob 是普通成员。</p>
<button onclick="select('Alice','editor')">登录 Alice（管理员）</button>
<button onclick="select('Bob','member')">登录 Bob（普通成员）</button>
<p id="who">未登录</p>
<button onclick="run('POST','/v1/organizations/G/crawl/tasks')">启动抓取任务</button>
<button onclick="run('GET','/v1/organizations/G/crawl/contents')">查看抓取内容</button>
<button id="edit" onclick="run('PUT','/v1/organizations/G/crawl/keywords')">修改抓取关键词</button>
<p>可选：粘贴 Oathkeeper 签发的 JWT，以调用真实接口。</p>
<input id="token" style="width:100%" placeholder="Bearer token">
<pre id="log"></pre>
<script>
let user=null;
function select(name,role){user={name,role};who.textContent=`当前用户：${name}（${role==='editor'?'管理员':'普通成员'}）`;edit.disabled=role!=='editor';log.textContent='已切换用户，权限由 Keto 规则决定。'}
async function run(method,path){if(!user)return log.textContent='请先登录';if(path.includes('keywords')&&method==='PUT'&&user.role!=='editor')return log.textContent='403：普通成员不能修改关键词';const token=document.getElementById('token').value.trim();if(!token)return log.textContent=`模拟 ${method} ${path}\n结果：允许（${user.name}）`;const r=await fetch('http://localhost:4455'+path,{method,headers:{Authorization:token.startsWith('Bearer ')?token:'Bearer '+token,'Content-Type':'application/json'},body:method==='PUT'?JSON.stringify({keywords:{values:['演示']}}):undefined});log.textContent=r.status+'\n'+await r.text()}
</script>
