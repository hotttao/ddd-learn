# Social 聚合服务的部署配置；本步骤为 XHS Client 启用 Proxyless xDS。
fullnameOverride: social-grpc-service

replicaCount: 1

image:
  repository: social_grpc
  tag: "0.0.1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8091
  # Service 的端口名称和 appProtocol 让 Kubernetes/Istio 按 gRPC 识别流量。
  portName: grpc
  appProtocol: grpc
  labels: {}

env:
  - name: INTERNAL_JWT_ISSUER
    value: oathkeeper
  - name: INTERNAL_JWT_AUDIENCE
    value: internal-api
  - name: INTERNAL_JWKS_URL
    value: "http://oathkeeper-api:4456/.well-known/jwks.json"
  - name: XHS_GRPC_ADDR
    value: "xhs-grpc-service.ddd-learn-proxyless.svc.cluster.local:80"
  # 以下环境变量由 kitex-contrib/xds 用于构造 xDS Node 身份和连接 istiod。
  - name: POD_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
  - name: POD_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
  - name: INSTANCE_IP
    valueFrom:
      fieldRef:
        fieldPath: status.podIP
  - name: KITEX_XDS_METAS
    value: '{"CLUSTER_ID":"Kubernetes","DNS_AUTO_ALLOCATE":"true","DNS_CAPTURE":"true","INSTANCE_IPS":"$(INSTANCE_IP)","NAMESPACE":"$(POD_NAMESPACE)"}'
  - name: KITEX_XDS_ISTIO_ADDR
    value: istiod.istio-system.svc:15010

# 当前服务暂时没有标准 gRPC Health Service，先使用 TCP 探针确认进程监听成功。
livenessProbe:
  httpGet: null
  tcpSocket:
    port: 8091
  initialDelaySeconds: 3
  timeoutSeconds: 2

readinessProbe:
  httpGet: null
  tcpSocket:
    port: 8091
  initialDelaySeconds: 3
  timeoutSeconds: 2
