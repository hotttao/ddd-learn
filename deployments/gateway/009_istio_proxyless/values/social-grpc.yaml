# Social 聚合服务的部署配置；本步骤只部署 Mock XHS Provider。
fullnameOverride: social-grpc-service

replicaCount: 1

image:
  repository: social_grpc
  tag: "0.0.1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8091
  # Service 的端口名称和 appProtocol 让 Kubernetes/Istio 按 gRPC 识别流量。
  portName: grpc
  appProtocol: grpc
  labels: {}

# 本步骤的 Social Handler 不读取认证信息；认证和 Internal JWT 传播在 Gateway 集成步骤处理。
env: []

# 当前服务暂时没有标准 gRPC Health Service，先使用 TCP 探针确认进程监听成功。
livenessProbe:
  httpGet: null
  tcpSocket:
    port: 8091
  initialDelaySeconds: 3
  timeoutSeconds: 2

readinessProbe:
  httpGet: null
  tcpSocket:
    port: 8091
  initialDelaySeconds: 3
  timeoutSeconds: 2
