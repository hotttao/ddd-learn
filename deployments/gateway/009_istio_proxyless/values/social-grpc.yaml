# Social 聚合服务的部署配置；本步骤将 XHS Provider 切换为真实 Kitex Client。
fullnameOverride: social-grpc-service

replicaCount: 1

image:
  repository: social_grpc
  tag: "0.0.1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8091
  # Service 的端口名称和 appProtocol 让 Kubernetes/Istio 按 gRPC 识别流量。
  portName: grpc
  appProtocol: grpc
  labels: {}

env:
  - name: INTERNAL_JWT_ISSUER
    value: oathkeeper
  - name: INTERNAL_JWT_AUDIENCE
    value: internal-api
  - name: INTERNAL_JWKS_URL
    value: "http://oathkeeper-api:4456/.well-known/jwks.json"
  - name: XHS_GRPC_ADDR
    value: "xhs-grpc-service:80"

# 当前服务暂时没有标准 gRPC Health Service，先使用 TCP 探针确认进程监听成功。
livenessProbe:
  httpGet: null
  tcpSocket:
    port: 8091
  initialDelaySeconds: 3
  timeoutSeconds: 2

readinessProbe:
  httpGet: null
  tcpSocket:
    port: 8091
  initialDelaySeconds: 3
  timeoutSeconds: 2
