# Istio Ambient/Proxyless 实验的 Keto values；部署到 ddd-learn-proxyless。
fullnameOverride: keto
replicaCount: 1

image:
  registry: ghcr.io
  repository: hotttao/ory-keto
  tag: v26.2.0
  pullPolicy: IfNotPresent

ingress:
  read:
    enabled: false
  write:
    enabled: false

keto:
  automigration:
    enabled: true
    type: job
  config:
    serve:
      read:
        host: 0.0.0.0
        port: 4466
      write:
        host: 0.0.0.0
        port: 4467
    namespaces:
      location: file:///etc/keto-namespaces/namespaces.ts
    dsn: postgres://keto:keto@ddd-learn-postgres-rw:5432/keto?sslmode=disable

service:
  read:
    # 当前 xhs 与管理初始化流程都调用 Keto REST API；Service 的协议元数据必须声明为
    # HTTP/1.1，不能继承 Chart 默认的纯 gRPC 协议声明。
    name: http-read
    appProtocol: http
    headless:
      enabled: false
  write:
    name: http-write
    appProtocol: http
    headless:
      enabled: false
  metrics:
    enabled: true

serviceMonitor:
  enabled: true

deployment:
  extraVolumes:
    - name: keto-namespaces
      configMap:
        name: keto-namespaces
  extraVolumeMounts:
    - name: keto-namespaces
      mountPath: /etc/keto-namespaces
      readOnly: true
