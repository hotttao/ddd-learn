# xhs_grpc 的独立部署配置；不会覆盖现有 xhs_service/xhs-service。
fullnameOverride: xhs-grpc-service

replicaCount: 2

image:
  repository: xhs_grpc
  tag: "0.0.1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8090
  # Service 的端口名称使用 grpc，供 Istio 和 Kubernetes 识别协议。
  portName: grpc
  appProtocol: grpc
  labels: {}

env:
  - name: INTERNAL_JWT_ISSUER
    value: "http://oathkeeper-api:4456/"
  - name: INTERNAL_JWT_AUDIENCE
    value: internal-api
  - name: INTERNAL_JWKS_URL
    value: "http://oathkeeper-api:4456/.well-known/jwks.json"
  - name: KETO_READ_URL
    value: "http://keto-read:80"

livenessProbe:
  httpGet: null
  # kubelet 的原生 gRPC Probe 调用 grpc.health.v1.Health/Check。
  grpc:
    port: 8090
  initialDelaySeconds: 5
  timeoutSeconds: 5

readinessProbe:
  httpGet: null
  # Ambient 不注入 Sidecar，kubelet 直接调用应用提供的标准 gRPC Health Service。
  grpc:
    port: 8090
  initialDelaySeconds: 5
  timeoutSeconds: 5
