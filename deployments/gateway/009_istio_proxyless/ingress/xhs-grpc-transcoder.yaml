# 第五步：在 Istio Ingress Envoy 中启用 XHS gRPC-JSON Transcoder。
# 该文件由 make transcoder-filter 生成，不要手工修改 descriptor 内容。
# apiVersion/kind：声明这是 Istio 的 EnvoyFilter，而不是 Gateway API 路由。
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  # metadata.name 是 EnvoyFilter 在 ddd-learn namespace 中的唯一名称。
  name: xhs-grpc-json-transcoder
  # 该配置只在 ddd-learn namespace 内生效。
  namespace: ddd-learn
spec:
  # 只匹配 Istio Gateway Controller 为 istio-ingress 创建的数据面 Pod。
  # 因此 Ory、xhs Pod 和 Ambient ztunnel 不会加载这个 HTTP Filter。
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: istio-ingress
  # 对匹配到的 Gateway Envoy 修改 HTTP Filter Chain。
  configPatches:
    # HTTP_FILTER 表示修改 HTTP Connection Manager 中的 HTTP 层过滤器。
    - applyTo: HTTP_FILTER
      match:
        # 只匹配 Gateway 上下文，不影响 sidecar 或其他 mesh listener。
        context: GATEWAY
        listener:
          filterChain:
            filter:
              # 目标是 HTTP Connection Manager，它承载 HTTP/HTTP2 路由和过滤器。
              name: envoy.filters.network.http_connection_manager
              subFilter:
                # 以 router 为锚点，保证 Transcoder 插入到最终路由转发之前。
                name: envoy.filters.http.router
      patch:
        # INSERT_BEFORE 确保 JSON 请求先被转换成 gRPC，再交给 router。
        operation: INSERT_BEFORE
        value:
          # Envoy 内置的 gRPC-JSON Transcoder HTTP Filter。
          name: envoy.filters.http.grpc_json_transcoder
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
            # descriptor 的 base64 内容由 deployments/.../transcoder/xhs.pb 生成。
            # 它包含 service、RPC、message 以及 google.api.http 映射。
            proto_descriptor_bin:  
            # 只开放 XHS 的两个 service，避免该 Filter 处理无关 protobuf service。
            services:
              - xhs_service.crawl.CrawlService
              - xhs_service.organization.OrganizationService
            # 保留 proto 字段原名，例如 organization_id，而不是转换成 organizationId。
            print_options:
              preserve_proto_field_names: true
