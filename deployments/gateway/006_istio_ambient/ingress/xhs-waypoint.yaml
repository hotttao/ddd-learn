# 第 6 步：为 xhs_service 声明一个只处理 Service 流量的 Istio Waypoint。
#
# 这是 Gateway API 资源。istio-waypoint GatewayClass controller 会根据它生成
# 对应的 Deployment、Service 和 ServiceAccount；这些派生资源不作为源码手工维护。
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: xhs-waypoint
  namespace: ddd-learn
  labels:
    # 指定该 Waypoint 处理 Service 级别的流量，而不是整个 namespace 的流量。
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
      allowedRoutes:
        # 控制 Gateway listener 接受哪些 Route 的 parentRefs 绑定请求。
        namespaces:
          # Route 与 Gateway 在同一个 namespace 时，绑定请求才会被接受。
          # 本例中 Gateway 位于 ddd-learn，因此只接受 ddd-learn 中的 Route。
          from: Same
