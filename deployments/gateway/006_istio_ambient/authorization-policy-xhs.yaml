# 第 5、6 步：只允许 frontend workload 访问 xhs_service。
#
# 第 5 步的 workload selector 适用于 ztunnel L4 授权；绑定 Waypoint 后，使用
# targetRefs 将策略交给 xhs Service 对应的 Waypoint 执行，保留原始调用方身份。
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: xhs-allow-frontend
  namespace: ddd-learn
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: xhs-service
  rules:
    - from:
        - source:
            # frontend ServiceAccount 对应的 Istio SPIFFE principal。
            principals:
              - cluster.local/ns/ddd-learn/sa/frontend
