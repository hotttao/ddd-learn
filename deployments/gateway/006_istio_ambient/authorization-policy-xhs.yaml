# 第 5 步：只允许 frontend workload 访问 xhs_service。
#
# selector 匹配 xhs Helm release 创建的 Pod 标签，而不是 Service 名称。
# Ambient ztunnel 在 L4 层根据 mTLS 对端的 SPIFFE principal 执行这条策略。
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: xhs-allow-frontend
  namespace: ddd-learn
spec:
  selector:
    matchLabels:
      # xhs chart 的 workload 标签；fullnameOverride 不会改变这个 chart name 标签。
      app.kubernetes.io/name: xhs
      # 当前 Helm release 名称，避免误选其他 xhs chart 实例。
      app.kubernetes.io/instance: xhs
  rules:
    - from:
        - source:
            # frontend ServiceAccount 对应的 Istio SPIFFE principal。
            principals:
              - cluster.local/ns/ddd-learn/sa/frontend
