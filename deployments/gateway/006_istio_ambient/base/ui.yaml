apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-example
  namespace: ddd-learn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui-example
  template:
    metadata:
      labels:
        app: ui-example
    spec:
      containers:
        - name: ui-example
          image: ui_example:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: ui-example
  namespace: ddd-learn
spec:
  type: ClusterIP
  selector:
    app: ui-example
  ports:
    - name: http
      port: 80
      targetPort: http
