# Istio Gateway API Controller 管理的入口路由。
# parentRefs 指向 gatewayClassName=istio 的 istio-ingress，不依赖 Envoy Gateway。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: istio-ui-example
  namespace: ddd-learn
spec:
  parentRefs:
    - name: istio-ingress
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ui-example
          port: 80
---
# Kratos 的服务端点本身从根路径开始，因此入口需要移除 /kratos 前缀。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: istio-kratos-public
  namespace: ddd-learn
spec:
  parentRefs:
    - name: istio-ingress
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /kratos
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: kratos-public
          port: 80
---
# Mailpit 已配置 base path=/mailpit，所以这里保留请求前缀。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: istio-mailpit
  namespace: ddd-learn
spec:
  parentRefs:
    - name: istio-ingress
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mailpit
      backendRefs:
        - name: mailpit
          port: 8025
---
# xhs_service 自己使用 /v1/xhs 前缀，入口不做 URL Rewrite。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: istio-xhs-service
  namespace: ddd-learn
spec:
  parentRefs:
    - name: istio-ingress
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/xhs
      backendRefs:
        - name: xhs-service
          port: 80
