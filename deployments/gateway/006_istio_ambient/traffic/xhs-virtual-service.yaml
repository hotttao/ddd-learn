# 第 7.3 步：在 xhs v1/v2 灰度路由上增加超时与 Retry。
# 该资源由 Istio 控制面下发给 xhs-waypoint，不由 Envoy Gateway 处理。
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: xhs-service-canary
  namespace: ddd-learn
spec:
  # 与 DestinationRule.host 保持一致，匹配 mesh 内对 xhs Service 的请求。
  hosts:
    - xhs-service.ddd-learn.svc.cluster.local
  http:
    - name: xhs-v1-v2-weighted
      # 一次请求最多等待 2 秒；超过后不再等待该请求。
      timeout: 2s
      retries:
        # 最多进行 3 次尝试（首次请求之外的重试次数由 Envoy 计算）。
        attempts: 3
        # 每次尝试最多等待 500ms，总超时仍受上面的 2s 限制。
        perTryTimeout: 500ms
        # 只对连接失败、流被拒绝、服务不可用和 5xx 响应重试。
        retryOn: connect-failure,refused-stream,unavailable,5xx
      route:
        - destination:
            host: xhs-service.ddd-learn.svc.cluster.local
            subset: v1
            port:
              number: 80
          weight: 90
        - destination:
            host: xhs-service.ddd-learn.svc.cluster.local
            subset: v2
            port:
              number: 80
          weight: 10
