# Decision API 模式下，Traefik 通过 X-Forwarded-* Header 传入原始请求信息。
- id: internal-api-authentication
  upstream:
    # Decision API 不使用这个地址转发请求，但 Rule 仍需声明一个上游。
    url: http://xhs_service:8082
  match:
    # 统一保护所有经过 API Router 的 /v1/ 接口。
    # matching_strategy=regexp，尖括号内必须使用合法正则；.* 表示任意后续路径。
    # Oathkeeper 的 URL 模板必须包含协议和 Host；<.*> 让 Host、端口由任意网关匹配。
    # 实际约束是 /v1/ 路径，避免把规则耦合到某个网关 IP 或宿主机端口。
    url: http://<.*>/v1/<.*>
    methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE

  authenticators:
    - # 通过 Kratos /sessions/whoami 验证 Session Cookie。
      handler: cookie_session

  authorizer:
    # 只判断是否已认证；业务权限由各自的业务服务判断。
    handler: allow

  mutators:
    - # 将可信 Subject 签发为 Authorization: Bearer <JWT>。
      handler: id_token
