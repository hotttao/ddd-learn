# Envoy Gateway 实验的 xhs_service values；部署到 ddd-learn namespace。
fullnameOverride: xhs-service

image:
  repository: xhs_service
  tag: "0.0.1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8082

env:
  - name: SERVER_ADDR
    value: ":8082"
  - name: INTERNAL_JWT_ENABLED
    value: "true"
  - name: INTERNAL_JWKS_URL
    value: "http://oathkeeper-api:4456/.well-known/jwks.json"
  - name: KETO_ENABLED
    value: "true"
  - name: KETO_READ_URL
    value: "http://keto-read:80"

livenessProbe:
  httpGet:
    path: /health
    port: http

readinessProbe:
  httpGet:
    path: /health
    port: http
