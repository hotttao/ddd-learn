version: v0.40.6

authenticators:
  noop:
    enabled: true
  jwt:
    enabled: true
    config:
      jwks_urls:
        - http://talos:4466/v2alpha1/derivedKeys/jwks.json
      required_audience:
        - xhs-api
      trusted_issuers:
        - talos
      token_from:
        header: Authorization

authorizers:
  allow:
    enabled: true

mutators:
  id_token:
    enabled: true
    config:
      issuer_url: http://oathkeeper:4455
      jwks_url: file:///etc/oathkeeper/id-token.jwks.json
      claims: '{"service_actor":"{{ print .Extra.act }}","amr":["service_token"]}'

errors:
  fallback:
    - json

access_rules:
  - id: xhs-service-token
    match:
      url: http://xhs-service:8082/<.*>
      methods: [GET, POST, PUT, DELETE]
    authenticators:
      - handler: jwt
    authorizer:
      handler: allow
    mutators:
      - handler: id_token

