services:
  auth-service:
    build:
      context: .
      dockerfile: build/package/auth-service.Dockerfile
    image: ddd-learn/auth-service:dev
    environment:
      HTTP_ADDR: :8081
      INTERNAL_JWT_ISSUER: http://auth-service:8081
      INTERNAL_JWT_AUDIENCE: internal-api
      INTERNAL_JWT_TTL: 5m
      SESSION_TTL: 24h
    ports:
      - "8081:8081"
    networks: [ddd-learn]

  xhs-service:
    build:
      context: .
      dockerfile: build/package/xhs-service.Dockerfile
    image: ddd-learn/xhs-service:dev
    environment:
      HTTP_ADDR: :8082
      AUTH_SERVICE_URL: http://auth-service:8081
      INTERNAL_JWT_ISSUER: http://auth-service:8081
      INTERNAL_JWT_AUDIENCE: internal-api
    depends_on:
      auth-service:
        condition: service_healthy
    ports:
      - "8082:8082"
    networks: [ddd-learn]

networks:
  ddd-learn:
    name: ddd-learn
