server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router needs the application entry for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Keep a public health endpoint for container and Gateway checks.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
